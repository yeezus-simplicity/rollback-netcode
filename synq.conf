# synq 帧同步服务器配置
#
# 优先级：命令行 > 环境变量 > 本文件 > 代码默认值
#   命令行覆盖：./gameserver --port=9000
#   环境变量：  set port=9000
#
# 改这个文件不需要重新编译 —— 这是「配置外置」的意义。

# ---------- 网络 ----------
port            = 8899
udp_port        = 8898          # UDP 输入包端口（与 TCP 分开）
max_clients     = 64

# ---------- 模拟 ----------
tick_rate       = 30            # 逻辑帧率
players         = 4
seed            = 20261003      # 固定种子 => 可重放
frames          = 1800          # 60 秒 @30fps

# ---------- 网络模拟参数（复现真实抖动） ----------
sim_latency_ms  = 60            # 往返延迟
sim_jitter_ms   = 15            # 抖动幅度
sim_loss_pct    = 1             # 丢包率 0-100

# ---------- 回滚 ----------
snapshot_depth  = 64            # 快照环深度（帧）
respawn_delay   = 150           # 复活延迟（帧）

# ---------- 可观测性 ----------
enable_metrics  = true
metrics_interval_s = 5          # /metrics 输出间隔
slow_rollback_ms = 50           # 重算超过此值告警
